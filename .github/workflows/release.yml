name: Release to PyPI

# Publishes scry-terminal to PyPI when a version tag is pushed.
# Uses Trusted Publishing (OIDC) — no API token in secrets.
#
# One-time setup (maintainer, in the PyPI web UI):
#   1. PyPI → your account → Publishing → "Add a new pending publisher":
#      owner/repo = pigarmahdar/Scry-Terminal, workflow = release.yml,
#      environment = pypi (or leave unset).
#   2. Push a tag:  git tag v1.0.1 && git push origin v1.0.1
#      The tag MUST match pyproject.toml (v prefix stripped).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release
  id-token: write # needed for PyPI Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VER"
          test "$TAG" = "$VER" || { echo "ERROR: tag v$TAG != pyproject version $VER"; exit 1; }

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          append_body: true

  binaries:
    # M5: standalone `scry` bundles (no Python required) attached to the same
    # release. Ordered after publish so binaries never appear for a version
    # that failed to ship — but not gated on it succeeding, because a re-run
    # of an already-published version fails at the PyPI upload (that version
    # exists) while the binaries are still worth building. A missing asset is
    # harmless; a broken one is not, hence the smoke tests below.
    needs: publish
    if: always() && needs.publish.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 runner; do NOT use macos-latest, its arch can shift.
          - { os: macos-14, artifact: scry-macos-arm64 }
          # Built on ubuntu's current glibc; see "Linux glibc" note in the plan.
          - { os: ubuntu-22.04, artifact: scry-linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the bundle
        run: |
          python -m pip install --upgrade pip
          # Pinned: unpinned PyInstaller can change artefact behaviour silently.
          pip install "pyinstaller==6.11.1"
          pip install -e .
          pyinstaller scry.spec --noconfirm

      - name: Smoke-test the bundle (no Python on PATH)
        run: |
          set -e
          ls -la dist/scry/scry
          du -sh dist/scry
          # Prove it runs standalone: empty env, minimal PATH.
          env -i PATH=/usr/bin:/bin HOME="$HOME" dist/scry/scry --help >/dev/null
          env -i PATH=/usr/bin:/bin HOME="$HOME" dist/scry/scry version
          # Data commands need a cache; use the committed fixture rather than
          # pulling 200 MB in the release path.
          FIX="$PWD/tests/fixtures/oracle_min.jsonl"
          env -i PATH=/usr/bin:/bin HOME="$HOME" SCRY_ORACLE_PATH="$FIX" \
            dist/scry/scry oracle "Sol Ring" | grep -q '"Sol Ring"'
          # Covers the aliases.json bundling regression that silently breaks
          # flavor-name resolution in frozen builds.
          env -i PATH=/usr/bin:/bin HOME="$HOME" SCRY_ORACLE_PATH="$FIX" \
            dist/scry/scry fuzzy "Master Emerald Shrine" | grep -q "Command Tower"
          # MCP must speak over stdio.
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | env -i PATH=/usr/bin:/bin HOME="$HOME" SCRY_ORACLE_PATH="$FIX" dist/scry/scry mcp \
            | grep -q "scryfall_oracle"
          # Never ship the 200 MB cache or the DB inside the artifact.
          ! find dist/scry -name "*.jsonl" -o -name "*.db" | grep -q .

      - name: Golden suite against the frozen binary
        # SCRY_BIN is the whole point: prove the BUNDLE matches the source.
        # Only the structural lane is meaningful here, because the baseline's
        # data figures were recorded against a full cache, not this fixture.
        env:
          NO_COLOR: "1"
          TERM: dumb
          SCRY_BIN: ${{ github.workspace }}/dist/scry/scry
          SCRY_ORACLE_PATH: ${{ github.workspace }}/tests/fixtures/oracle_min.jsonl
        run: python tests/cli_golden.py --lane structural

      - name: Package
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C dist scry

      - uses: softprops/action-gh-release@v2
        with:
          files: "${{ matrix.artifact }}.tar.gz"
          append_body: true

