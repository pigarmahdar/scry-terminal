name: Release to PyPI

# Publishes scry-terminal to PyPI when a version tag is pushed.
# Uses Trusted Publishing (OIDC) — no API token in secrets.
#
# One-time setup (maintainer, in the PyPI web UI):
#   1. PyPI → your account → Publishing → "Add a new pending publisher":
#      owner/repo = pigarmahdar/Scry-Terminal, workflow = release.yml,
#      environment = pypi (or leave unset).
#   2. Push a tag:  git tag v1.0.1 && git push origin v1.0.1
#      The tag MUST match pyproject.toml (v prefix stripped).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release
  id-token: write # needed for PyPI Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VER"
          test "$TAG" = "$VER" || { echo "ERROR: tag v$TAG != pyproject version $VER"; exit 1; }

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          append_body: true
